<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img"><title>How Hey Atu works</title><desc>Phones and desktop clients connect through a relay to Pi on your own computer.</desc><rect width="1200" height="290" rx="24" fill="#f7f7f8"/><rect x="64" y="64" width="296" height="130" rx="18" fill="#ffffff" stroke="#dedee3" stroke-width="2"/><text x="212" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#18181b" text-anchor="middle" >iPhone · iPad</text><text x="212" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#4f4f58" text-anchor="middle" >Desktop · Terminal</text><path d="M370 129 h 72" stroke="#d97757" stroke-width="3" stroke-linecap="round"/><path d="M432 121 l 10 8 l -10 8" fill="none" stroke="#d97757" stroke-width="3" stroke-linecap="round"/><rect x="452" y="64" width="296" height="130" rx="18" fill="#ffffff" stroke="#dedee3" stroke-width="2"/><text x="600" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#18181b" text-anchor="middle" >Relay</text><text x="600" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#4f4f58" text-anchor="middle" >forwards only</text><path d="M758 129 h 72" stroke="#d97757" stroke-width="3" stroke-linecap="round"/><path d="M820 121 l 10 8 l -10 8" fill="none" stroke="#d97757" stroke-width="3" stroke-linecap="round"/><rect x="840" y="64" width="296" height="130" rx="18" fill="#18181b" stroke="#dedee3" stroke-width="2"/><text x="988" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" >Your computer</text><text x="988" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#c9c9ce" text-anchor="middle" >Pi · files · tools</text><text x="64" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4f4f58" text-anchor="start" >Your work stays on your computer. Other devices see it and continue it.</text></svg>
